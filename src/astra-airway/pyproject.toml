[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astra-airway"
version = "0.3.0"
description = "Standalone 3D airway segmentation using ASTRA-Net and reference models"
readme = {text = "Standalone 3D airway segmentation with ASTRA-Net. Documentation: https://github.com/guhong3648/ASTRA-Net", content-type = "text/markdown"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<2",
    "torch>=2.1",
    "scipy>=1.11,<2",
    "opencv-python-headless>=4.8,<5",
    "tqdm>=4.65",
    "lungmask==0.2.20",
    "scikit-image==0.22.0",
]

[project.optional-dependencies]
demo = ["SimpleITK>=2.3", "matplotlib>=3.7", "ipykernel>=6.0"]

[tool.setuptools.packages.find]
include = ["astra_infer*"]
